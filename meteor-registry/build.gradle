plugins {
    id 'java-library'
    id 'maven-publish'
}

ext.pomName = 'Meteor Registry'
description = 'Meteor registry storage, application client, and administration.'

dependencies {
    api project(':meteor')

    // for test
    testImplementation project(':meteor-protocol-soap')
    testImplementation "ognl:ognl:${property('lib.ognl')}"
}