# Hasor Boot 仅扫描本示例；由角色入口显式绑定实现或消费者。
hasor.loadPackages=net.hasor.meteor.example
hasor.boot.web.connectors.http.enabled=false
meteor.application=example-provider
meteor.data-home=${user.home}/.meteor/example-provider2
meteor.unit=default
meteor.default-protocol=rsf
meteor.default-timeout=5000
meteor.connect-timeout=3000

# 复用 RegistryMain 启动的 H2 注册存储。
example.jdbc.url=jdbc:h2:tcp://127.0.0.1:19192/mem:console-debug
example.jdbc.username=sa
example.jdbc.password=
meteor.registry.provider=jdbc
meteor.registry.data-source=registryDataSource
meteor.registry.publish-host=127.0.0.1
meteor.registry.management-token=console-debug
meteor.registry.management-protocols=rsf
meteor.registry.refresh-millis=500

# 各协议端口直接列出，提供者与消费者互不占用；按需删除对应协议即可禁用。
meteor.connectors.rsf.host=127.0.0.1
meteor.connectors.rsf.port=19300

meteor.connectors.dubbo.host=127.0.0.1
meteor.connectors.dubbo.port=19301

meteor.connectors.thrift.host=127.0.0.1
meteor.connectors.thrift.port=19302
meteor.connectors.thrift.options.multiplexed=true

meteor.connectors.oncrpc.host=127.0.0.1
meteor.connectors.oncrpc.port=19303

meteor.connectors.hprose.host=127.0.0.1
meteor.connectors.hprose.port=19304
meteor.connectors.hprose.context=/hprose

meteor.connectors.jsonrpc.host=127.0.0.1
meteor.connectors.jsonrpc.port=19306
meteor.connectors.jsonrpc.context=/jsonrpc

meteor.connectors.xmlrpc.host=127.0.0.1
meteor.connectors.xmlrpc.port=19307
meteor.connectors.xmlrpc.context=/xmlrpc

meteor.connectors.hessian.host=127.0.0.1
meteor.connectors.hessian.port=19308
meteor.connectors.hessian.context=/hessian

# HTTP 契约与 Protobuf 系列协议。
meteor.connectors.soap.host=127.0.0.1
meteor.connectors.soap.port=19305
meteor.connectors.soap.context=/soap

meteor.connectors.grpc.host=127.0.0.1
meteor.connectors.grpc.port=19309
meteor.connectors.grpc.context=/grpc
meteor.connectors.grpc.options.httpVersion=2

meteor.connectors.grpc-web.host=127.0.0.1
meteor.connectors.grpc-web.port=19310
meteor.connectors.grpc-web.context=/grpc-web

meteor.connectors.connect.host=127.0.0.1
meteor.connectors.connect.port=19311
meteor.connectors.connect.context=/connect

meteor.connectors.triple.host=127.0.0.1
meteor.connectors.triple.port=19312
meteor.connectors.triple.context=/triple
meteor.connectors.triple.options.httpVersion=2

# 同一 RPC 协议的其它传输入口。
meteor.connectors.thrift-http.host=127.0.0.1
meteor.connectors.thrift-http.port=19313
meteor.connectors.thrift-http.context=/thrift
meteor.connectors.thrift-http.options.multiplexed=true

meteor.connectors.oncrpc-udp.host=127.0.0.1
meteor.connectors.oncrpc-udp.port=19314
