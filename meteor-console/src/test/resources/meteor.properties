# HTTP 控制台；关闭后仍可运行注册中心管理 RPC。
hasor.boot.web.connectors.http.enabled=true
hasor.boot.web.connectors.http.host=127.0.0.1
hasor.boot.web.connectors.http.port=8080
meteor.data.directory=build/runtime/console
meteor.client.unit=default
# 管理连接空闲寿命，单位毫秒；每秒检查一次。
meteor.commands.context.ttl-millis=300000
meteor.web.session.secure-cookie=false
meteor.web.auth.enabled=false
# 开启登录时设置账号密码，也可通过环境变量提供密码。
meteor.web.auth.account=admin:${METEOR_CONSOLE_PASSWORD}

meteor.rpc.enabled=false
meteor.rpc.host=127.0.0.1
meteor.rpc.port=19193
meteor.rpc.unit=default
# 也可通过 METEOR_REGISTRY_MANAGEMENT_TOKEN 环境变量提供管理凭据。
meteor.rpc.token=
