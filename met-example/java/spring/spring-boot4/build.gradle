plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.9'
}

description = 'Meteor Spring Boot 3 Echo example'

springBoot {
    mainClass = providers.gradleProperty('mainClass').orElse('net.hasor.example.integration.ProviderMain')
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation("net.hasor:meteor-spring-starter:${version}") {
        exclude group: 'org.springframework.boot'
        exclude group: 'org.springframework'
    }
}

tasks.named('bootJar') {
    archiveClassifier.set(springBoot.mainClass.map { entry ->
        if (entry.endsWith('ConsumerMain')) {
            return 'consumer'
        }
        return 'provider'
    })
}
