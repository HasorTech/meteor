<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="420" viewBox="0 0 1450 420" role="img" aria-labelledby="title desc">
<title id="title">Meteor 整体架构</title><desc id="desc">应用、RPC 调度、协议和网络传输组成业务调用链，注册中心独立同步地址和治理配置。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6b20"/></marker></defs>
<rect width="1450" height="420" rx="16" fill="#fffdf6"/>
<g font-family="system-ui, sans-serif" fill="#302c22">
<path d="M 230 195 H 290" fill="none" stroke="#8a6b20" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 510 195 H 570" fill="none" stroke="#8a6b20" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 780 195 H 840" fill="none" stroke="#8a6b20" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1070 195 H 1130" fill="none" stroke="#8a6b20" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 400 105 V 145" fill="none" stroke="#8a6b20" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<path d="M 675 305 V 245" fill="none" stroke="#8a6b20" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<path d="M 400 305 V 245" fill="none" stroke="#8a6b20" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<rect x="30" y="145" width="200" height="100" rx="10" fill="#ffffff" stroke="#d4c9aa" stroke-width="1.5"/>
<text x="130.0" y="188.0" text-anchor="middle" font-size="19" font-weight="600">用户应用</text>
<text x="130.0" y="214.0" text-anchor="middle" font-size="16" font-weight="400">发布实现 / 调用代理</text>
<rect x="290" y="145" width="220" height="100" rx="10" fill="#fff0b7" stroke="#c5a44b" stroke-width="1.5"/>
<text x="400.0" y="188.0" text-anchor="middle" font-size="19" font-weight="600">MetContext</text>
<text x="400.0" y="214.0" text-anchor="middle" font-size="16" font-weight="400">服务管理 / RPC 调度</text>
<rect x="570" y="145" width="210" height="100" rx="10" fill="#ffffff" stroke="#d4c9aa" stroke-width="1.5"/>
<text x="675.0" y="188.0" text-anchor="middle" font-size="19" font-weight="600">RPC 协议</text>
<text x="675.0" y="214.0" text-anchor="middle" font-size="16" font-weight="400">请求 / 响应编解码</text>
<rect x="840" y="145" width="230" height="100" rx="10" fill="#ffffff" stroke="#d4c9aa" stroke-width="1.5"/>
<text x="955.0" y="188.0" text-anchor="middle" font-size="19" font-weight="600">网络传输</text>
<text x="955.0" y="214.0" text-anchor="middle" font-size="16" font-weight="400">连接 / 连接处理链</text>
<rect x="1130" y="145" width="285" height="100" rx="10" fill="#ffffff" stroke="#d4c9aa" stroke-width="1.5"/>
<text x="1272.5" y="188.0" text-anchor="middle" font-size="19" font-weight="600">远端应用</text>
<text x="1272.5" y="214.0" text-anchor="middle" font-size="16" font-weight="400">协议 → RPC 调度 → 业务</text>
<rect x="290" y="35" width="220" height="70" rx="10" fill="#ffffff" stroke="#d4c9aa" stroke-width="1.5"/>
<text x="400.0" y="76.0" text-anchor="middle" font-size="19" font-weight="600">应用扩展</text>
<rect x="570" y="305" width="210" height="75" rx="10" fill="#ffffff" stroke="#d4c9aa" stroke-width="1.5"/>
<text x="675.0" y="335.5" text-anchor="middle" font-size="19" font-weight="600">序列化编码器</text>
<text x="675.0" y="361.5" text-anchor="middle" font-size="16" font-weight="400">由协议按需使用</text>
<rect x="30" y="305" width="480" height="75" rx="10" fill="#ffffff" stroke="#d4c9aa" stroke-width="1.5"/>
<text x="270.0" y="335.5" text-anchor="middle" font-size="19" font-weight="600">注册中心</text>
<text x="270.0" y="361.5" text-anchor="middle" font-size="16" font-weight="400">同步服务地址 / 治理配置，不转发请求</text>
</g></svg>
