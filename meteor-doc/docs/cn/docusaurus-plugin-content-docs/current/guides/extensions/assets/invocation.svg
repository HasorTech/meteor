<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="420" viewBox="0 0 1450 420" role="img" aria-labelledby="title desc">
<title id="title">一次 RPC 调用的处理路径</title><desc id="desc">消费者选择地址，本地调用绕过网络；远程调用经过拦截器、协议和传输进入提供者，响应原路返回。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6b20"/></marker></defs>
<rect width="1450" height="420" rx="16" fill="#fffdf6"/>
<g font-family="system-ui, sans-serif" fill="#302c22">
<path d="M 225 202 H 265" fill="none" stroke="#8a6b20" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 465 202 H 505" fill="none" stroke="#8a6b20" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 705 202 H 745" fill="none" stroke="#8a6b20" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 945 202 H 985" fill="none" stroke="#8a6b20" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1185 202 H 1225" fill="none" stroke="#8a6b20" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 365 150 V 65 H 505" fill="none" stroke="#8a6b20" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 1325 255 V 330 H 125 V 255" fill="none" stroke="#8a6b20" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<rect x="25" y="150" width="200" height="105" rx="10" fill="#ffffff" stroke="#d4c9aa" stroke-width="1.5"/>
<text x="125.0" y="195.5" text-anchor="middle" font-size="19" font-weight="600">消费者接口代理</text>
<text x="125.0" y="221.5" text-anchor="middle" font-size="16" font-weight="400">方法 / 参数</text>
<rect x="265" y="150" width="200" height="105" rx="10" fill="#fff0b7" stroke="#c5a44b" stroke-width="1.5"/>
<text x="365.0" y="195.5" text-anchor="middle" font-size="19" font-weight="600">确定目标地址</text>
<text x="365.0" y="221.5" text-anchor="middle" font-size="16" font-weight="400">判断本地调用</text>
<rect x="505" y="150" width="200" height="105" rx="10" fill="#ffffff" stroke="#d4c9aa" stroke-width="1.5"/>
<text x="605.0" y="195.5" text-anchor="middle" font-size="19" font-weight="600">消费端调用处理</text>
<text x="605.0" y="221.5" text-anchor="middle" font-size="16" font-weight="400">拦截器</text>
<rect x="745" y="150" width="200" height="105" rx="10" fill="#ffffff" stroke="#d4c9aa" stroke-width="1.5"/>
<text x="845.0" y="195.5" text-anchor="middle" font-size="19" font-weight="600">协议 / 网络</text>
<text x="845.0" y="221.5" text-anchor="middle" font-size="16" font-weight="400">编码 → 发送 → 解码</text>
<rect x="985" y="150" width="200" height="105" rx="10" fill="#fff0b7" stroke="#c5a44b" stroke-width="1.5"/>
<text x="1085.0" y="195.5" text-anchor="middle" font-size="19" font-weight="600">提供者 RPC 调度</text>
<text x="1085.0" y="221.5" text-anchor="middle" font-size="16" font-weight="400">拦截器 / 业务分派</text>
<rect x="1225" y="150" width="200" height="105" rx="10" fill="#ffffff" stroke="#d4c9aa" stroke-width="1.5"/>
<text x="1325.0" y="195.5" text-anchor="middle" font-size="19" font-weight="600">业务实现</text>
<text x="1325.0" y="221.5" text-anchor="middle" font-size="16" font-weight="400">结果 / 异常</text>
<rect x="505" y="30" width="200" height="70" rx="10" fill="#ffffff" stroke="#d4c9aa" stroke-width="1.5"/>
<text x="605.0" y="58.0" text-anchor="middle" font-size="19" font-weight="600">本地实现</text>
<text x="605.0" y="84.0" text-anchor="middle" font-size="16" font-weight="400">不经协议和网络</text>
<text x="750" y="307" text-anchor="middle" font-size="16" fill="#6e6551">响应返回：协议编码 → 网络 → 协议解码 → 完成 Future / 回调</text>
<text x="725" y="385" text-anchor="middle" font-size="16" fill="#6e6551">注册中心只向消费者同步地址和治理配置，不参与本次业务请求转发</text>
</g></svg>
