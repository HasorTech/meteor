<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="240" viewBox="0 0 1080 240" role="img" aria-labelledby="title desc">
  <title id="title">多协议发布</title>
  <desc id="desc">JSON-RPC 客户端和 Hessian 客户端分别连接对应协议的接入点，经 Meteor 的 RPC 调度，调用用户应用中的同一个 EchoService 实现。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8a6818"/></marker></defs>
  <g font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" fill="#302e28">
    <rect x="280" y="10" width="490" height="220" rx="12" fill="#fffcf0" stroke="#d7c68f"/>
    <text x="525" y="40" font-size="16" fill="#6c644d">Meteor</text>
    <rect x="10" y="60" width="210" height="50" rx="8" fill="#f5f6f7" stroke="#d3d5d8"/>
    <text x="115" y="91">JSON-RPC 客户端</text>
    <rect x="10" y="150" width="210" height="50" rx="8" fill="#f5f6f7" stroke="#d3d5d8"/>
    <text x="115" y="181">Hessian 客户端</text>
    <rect x="300" y="60" width="200" height="50" rx="7" fill="#fbeebd" stroke="#d7c68f"/>
    <text x="400" y="91">JSON-RPC 接入点</text>
    <rect x="300" y="150" width="200" height="50" rx="7" fill="#fbeebd" stroke="#d7c68f"/>
    <text x="400" y="181">Hessian 接入点</text>
    <g fill="none" stroke="#8a6818" stroke-width="2" marker-end="url(#arrow)">
      <path d="M220 85H296"/><path d="M220 175H296"/>
      <path d="M500 85H540V115H586"/><path d="M500 175H540V145H586"/>
      <path d="M740 130H826"/>
    </g>
    <rect x="590" y="95" width="150" height="70" rx="8" fill="#fff" stroke="#b59b51"/>
    <text x="665" y="137" font-weight="600">RPC 调度</text>
    <rect x="830" y="50" width="240" height="160" rx="12" fill="#f5f6f7" stroke="#d3d5d8"/>
    <text x="950" y="80" font-size="16" fill="#6c644d">用户应用</text>
    <rect x="850" y="100" width="200" height="80" rx="8" fill="#fff" stroke="#b5b7bb"/>
    <text x="950" y="132" font-weight="600">同一个 EchoService</text>
    <text x="950" y="159">业务实现</text>
  </g>
</svg>
